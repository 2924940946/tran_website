<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yts_网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #050510;
        }

        body {
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0ff;
            position: relative;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 1; }
        #fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 2; }

        .scanline {
            position: fixed; inset: 0; z-index: 3; pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15) 0px,
                rgba(0,0,0,0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.35;
            mix-blend-mode: overlay;
        }

        .glow-orb {
            position: fixed; border-radius: 50%; filter: blur(90px);
            z-index: 0; pointer-events: none;
            animation: orbFloat 22s ease-in-out infinite;
        }
        .orb-1 { width: 420px; height: 420px; background: rgba(120,80,255,0.28); top: -120px; left: -120px; }
        .orb-2 { width: 360px; height: 360px; background: rgba(0,200,255,0.20); bottom: -130px; right: -90px; animation-delay: -8s; }
        .orb-3 { width: 300px; height: 300px; background: rgba(255,0,180,0.14); top: 55%; left: 62%; animation-delay: -15s; }

        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(70px,-50px) scale(1.12); }
            66% { transform: translate(-50px,60px) scale(0.94); }
        }

        .card {
            position: relative; z-index: 4;
            background: rgba(10,10,25,0.5);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(120,140,255,0.22);
            border-radius: 20px;
            box-shadow:
                0 0 40px rgba(100,80,255,0.15),
                0 0 80px rgba(0,200,255,0.08),
                inset 0 0 60px rgba(80,60,200,0.05);
            max-width: 660px; width: 100%;
            padding: 52px 44px;
            text-align: center;
            animation: cardIn 1s cubic-bezier(0.16,1,0.3,1);
            overflow: hidden;
        }

        .card::before {
            content: ""; position: absolute; top: 0; left: -50%; width: 200%; height: 2px;
            background: linear-gradient(90deg, transparent, #6a5cff, #00d4ff, #ff00b4, transparent);
            animation: scanBeam 4s linear infinite;
        }
        @keyframes scanBeam { 0% { transform: translateX(-50%); } 100% { transform: translateX(50%); } }
        @keyframes cardIn { from { opacity:0; transform: translateY(40px) scale(0.96); } to { opacity:1; transform: translateY(0) scale(1); } }

        .avatar-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 26px; }
        .avatar-ring {
            position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #6a5cff; border-right-color: #00d4ff;
            animation: spin 3s linear infinite;
        }
        .avatar-ring::after {
            content: ""; position: absolute; inset: 6px; border-radius: 50%;
            border: 1px solid transparent; border-bottom-color: #ff00b4;
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, #6a5cff, #00d4ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(106,92,255,0.6);
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            cursor: pointer;
        }
        .avatar:hover { transform: scale(1.12) rotate(8deg); box-shadow: 0 0 50px rgba(0,212,255,0.8); }

        h1 {
            font-size: 32px; font-weight: 800; letter-spacing: 1px; margin-bottom: 12px;
            background: linear-gradient(90deg,#6a5cff,#00d4ff,#ff00b4,#6a5cff);
            background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: gradientShift 6s linear infinite;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        .subtitle {
            color: #8a8ab8; font-size: 13px; letter-spacing: 3px;
            text-transform: uppercase; margin-bottom: 28px; min-height: 20px;
        }
        .cursor {
            display: inline-block; width: 2px; height: 13px; background: #00d4ff;
            margin-left: 4px; vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        p.intro {
            line-height: 1.9; color: #b0b0d8; font-size: 15px; margin-bottom: 32px;
        }
        .intro .hl { color: #00d4ff; text-shadow: 0 0 12px rgba(0,212,255,0.6); }

        .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .links a {
            position: relative; text-decoration: none; padding: 13px 26px;
            border-radius: 10px; font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            overflow: hidden;
        }
        .links a.primary {
            background: linear-gradient(135deg,#6a5cff,#00d4ff); color: #fff;
            box-shadow: 0 0 20px rgba(106,92,255,0.4);
        }
        .links a.primary::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }
        .links a.primary:hover::after { left: 100%; }
        .links a.primary:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 35px rgba(0,212,255,0.7); }
        .links a.secondary {
            border: 1px solid rgba(120,140,255,0.4); color: #b0b0d8;
            background: rgba(120,140,255,0.05);
        }
        .links a.secondary:hover {
            border-color: #00d4ff; color: #00d4ff;
            box-shadow: 0 0 25px rgba(0,212,255,0.3); transform: translateY(-3px);
        }

        footer {
            margin-top: 40px; font-size: 12px; color: #5a5a80; letter-spacing: 1px;
        }
        footer .dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #00d4ff; margin: 0 8px; vertical-align: middle;
            box-shadow: 0 0 8px #00d4ff; animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:0.4; transform: scale(0.7); } }

        @media (max-width: 480px) {
            .card { padding: 38px 22px; }
            h1 { font-size: 24px; }
            .avatar-wrap { width: 76px; height: 76px; }
            .avatar { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>

    <canvas id="bgCanvas"></canvas>
    <canvas id="fxCanvas"></canvas>
    <div class="scanline"></div>

    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <div class="avatar">🚀</div>
        </div>
        <h1>你好!</h1>
        <p class="subtitle"><span id="typewriter"></span><span class="cursor"></span></p>
        <p class="intro">
            这是一个yts<span class="hl"></span>编写的静态页面。<br>
            <br>
            用来存档yts的一些知识
        </p>
        <div class="links">
            <a href="https://github.com/2924940946" target="_blank" class="primary">GitHub Pages</a>
            <a href="https://www.netlify.com/" target="_blank" class="secondary">Netlify</a>
        </div>
        <footer>© 2026 MY PORTFOLIO <span class="dot"></span> POWERED BY HTML &amp; CSS</footer>
    </div>

    <script>
        /* ========== 打字机 ========== */
        (function () {
            const el = document.getElementById('typewriter');
            const texts = ['WELCOME TO MY SPACE', 'A PURE STATIC SITE', 'MOVE YOUR MOUSE', 'A NEON STARFIELD'];
            let ti = 0, ci = 0, deleting = false;

            function tick() {
                const cur = texts[ti];
                if (!deleting) {
                    el.textContent = cur.slice(0, ci + 1);
                    ci++;
                    if (ci === cur.length) { deleting = true; setTimeout(tick, 1600); return; }
                    setTimeout(tick, 80);
                } else {
                    el.textContent = cur.slice(0, ci - 1);
                    ci--;
                    if (ci === 0) { deleting = false; ti = (ti + 1) % texts.length; setTimeout(tick, 400); return; }
                    setTimeout(tick, 40);
                }
            }
            tick();
        })();

        /* ========== 星空粒子：自由漂浮 + 鼠标引力 + 连线 ========== */
        (function () {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            let stars = [];
            const mouse = { x: -9999, y: -9999, active: false };
            const MOUSE_RADIUS = 170;
            const LINK_DIST = 120;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                initStars();
            }

            function initStars() {
                stars = [];
                const count = Math.min(150, Math.floor((W * H) / 11000));
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        r: Math.random() * 1.5 + 0.6,
                        hue: 220 + Math.random() * 120
                    });
                }
            }

            window.addEventListener('resize', () => {
                clearTimeout(window.__rz);
                window.__rz = setTimeout(resize, 200);
            });

            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            });
            window.addEventListener('mouseleave', () => {
                mouse.active = false;
                mouse.x = -9999;
                mouse.y = -9999;
            });

            resize();

            function draw() {
                ctx.clearRect(0, 0, W, H);

                for (const s of stars) {
                    // 鼠标引力扰动
                    if (mouse.active) {
                        const dx = mouse.x - s.x;
                        const dy = mouse.y - s.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < MOUSE_RADIUS && dist > 0.1) {
                            const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
                            s.vx += (dx / dist) * force * 0.06;
                            s.vy += (dy / dist) * force * 0.06;
                        }
                    }

                    // 阻尼
                    s.vx *= 0.985;
                    s.vy *= 0.985;

                    // 保持缓慢漂移
                    if (Math.abs(s.vx) < 0.05) s.vx += (Math.random() - 0.5) * 0.02;
                    if (Math.abs(s.vy) < 0.05) s.vy += (Math.random() - 0.5) * 0.02;

                    s.x += s.vx;
                    s.y += s.vy;

                    // 边界环绕
                    if (s.x < -20) s.x = W + 20;
                    if (s.x > W + 20) s.x = -20;
                    if (s.y < -20) s.y = H + 20;
                    if (s.y > H + 20) s.y = -20;
                }

                // 星星之间连线
                for (let i = 0; i < stars.length; i++) {
                    for (let j = i + 1; j < stars.length; j++) {
                        const a = stars[i], b = stars[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const d = Math.hypot(dx, dy);
                        if (d < LINK_DIST) {
                            const alpha = (1 - d / LINK_DIST) * 0.28;
                            ctx.strokeStyle = `rgba(120,140,255,${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }

                // 鼠标高亮连线
                if (mouse.active) {
                    for (const s of stars) {
                        const d = Math.hypot(s.x - mouse.x, s.y - mouse.y);
                        if (d < MOUSE_RADIUS) {
                            const alpha = (1 - d / MOUSE_RADIUS) * 0.45;
                            ctx.strokeStyle = `rgba(0,212,255,${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.moveTo(s.x, s.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }

                // 星星本体
                for (const s of stars) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${s.hue},90%,75%,0.9)`;
                    ctx.shadowColor = `hsl(${s.hue},90%,70%)`;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                requestAnimationFrame(draw);
            }
            draw();
        })();

        /* ========== 鼠标拖尾粒子（无点击爆炸） ========== */
        (function () {
            const canvas = document.getElementById('fxCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            let particles = [];
            const mouse = { x: -9999, y: -9999, lastX: -9999, lastY: -9999 };

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function randHue() {
                const hues = [245, 200, 320];
                return hues[Math.floor(Math.random() * hues.length)] + (Math.random() * 20 - 10);
            }

            class Particle {
                constructor(x, y, opts = {}) {
                    this.x = x; this.y = y;
                    const angle = opts.angle !== undefined ? opts.angle : Math.random() * Math.PI * 2;
                    const speed = opts.speed !== undefined ? opts.speed : Math.random() * 2 + 0.6;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = opts.size !== undefined ? opts.size : Math.random() * 2.5 + 1;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.012;
                    this.hue = randHue();
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.vx *= 0.97; this.vy *= 0.97;
                    this.life -= this.decay;
                }
                draw() {
                    if (this.life <= 0) return;
                    ctx.save();
                    ctx.globalAlpha = Math.max(this.life, 0);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${this.hue},95%,70%)`;
                    ctx.shadowColor = `hsl(${this.hue},95%,65%)`;
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.restore();
                }
            }

            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX; mouse.y = e.clientY;
                if (mouse.lastX < 0) { mouse.lastX = mouse.x; mouse.lastY = mouse.y; }
                const dx = mouse.x - mouse.lastX;
                const dy = mouse.y - mouse.lastY;
                const speed = Math.hypot(dx, dy);
                const count = Math.min(6, Math.floor(speed / 3) + 1);
                const baseAngle = Math.atan2(dy, dx) + Math.PI;
                for (let i = 0; i < count; i++) {
                    const angle = baseAngle + (Math.random() - 0.5) * 1.2;
                    particles.push(new Particle(mouse.x, mouse.y, {
                        angle, speed: Math.random() * 2 + 0.5,
                        size: Math.random() * 2 + 0.8
                    }));
                }
                mouse.lastX = mouse.x; mouse.lastY = mouse.y;
            });

            window.addEventListener('mouseleave', () => {
                mouse.lastX = -9999; mouse.lastY = -9999;
            });

            function animate() {
                ctx.clearRect(0, 0, W, H);

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update(); p.draw();
                    if (p.life <= 0) particles.splice(i, 1);
                }
                if (particles.length > 500) particles.splice(0, particles.length - 500);

                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
